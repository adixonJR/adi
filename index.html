<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi semana</title>
<style>
:root{
  --bg:#eef3f0; --card:#fff; --ink:#12302a; --soft:#5d746d; --line:#d5e0db;
  --ok:#1f8a5b; --warn:#d9822b; --bad:#c0392b; --tip:#2f6fb0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1a17; --card:#16282399; --ink:#e6f1ed; --soft:#8fa89f; --line:#2a403a; --ok:#3cc88a; --warn:#f0a050; --bad:#ec6b5c; --tip:#6aa9e8}
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.4;padding:16px}
main{max-width:520px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-size:1.1rem;margin:0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{width:40px;height:40px;font-size:1.2rem}
.nav .t{text-align:center}
.nav small{color:var(--soft);display:block}
.hero{text-align:left}
.hero .lbl{color:var(--soft);font-size:.9rem}
.hero .big{font-size:3rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .big.ok{color:var(--ok)} .hero .big.warn{color:var(--warn)} .hero .big.bad{color:var(--bad)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{font-size:.8rem;color:var(--soft)}
.stats b{display:block;font-size:1.05rem;color:var(--ink)}
.hint{margin:10px 0 0;font-size:.92rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{padding:10px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font-weight:600}
.seg button.on.g{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.p{background:var(--tip);border-color:var(--tip);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit}
label{font-size:.8rem;color:var(--soft);display:block;margin-bottom:3px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--tip);outline-offset:1px}
.add{width:100%;padding:12px;background:var(--ink);color:var(--bg);border:0;font-weight:700}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{flex:1;padding:10px;font-size:.9rem}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.mode button{padding:9px;font-weight:600}
.mode button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.now{color:var(--soft);font-size:.85rem;text-align:center;margin-bottom:10px;text-transform:capitalize}
.save-card .big2{font-size:2rem;font-weight:700}
.save-card .sv{display:flex;align-items:center;gap:8px}
.save-card .sv span{font-size:1.4rem;font-weight:700}
.save-card input{font-size:1.6rem;font-weight:700}
.save-card small{color:var(--soft);display:block;margin-top:6px}
.item small{color:var(--soft);width:42px;flex:none}
.days div[data-d]{cursor:pointer}
.days div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem;color:var(--soft)}
.days i{display:block;width:100%;background:var(--ok);border-radius:6px 6px 0 0;min-height:2px}
.days .today{color:var(--ink);font-weight:700}
h2{font-size:.95rem;margin:0 0 8px}
.day{margin-top:10px;font-size:.8rem;color:var(--soft);font-weight:700}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item span{flex:1}
.item .m{font-weight:700}
.item .m.g{color:var(--bad)} .item .m.p{color:var(--tip)}
.item button{border:0;color:var(--soft);padding:4px 8px}
.empty{color:var(--soft);font-size:.92rem;margin:0}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist .h{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;width:100%;text-align:left}
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="now" id="now"></div>
    <div class="mode"><button id="mDia">Día</button><button id="mSem">Semana</button></div>
    <div class="nav">
      <button id="prev" aria-label="Semana anterior">‹</button>
      <div class="t"><h1 id="range"></h1><small id="wk"></small></div>
      <button id="next" aria-label="Semana siguiente">›</button>
    </div>
  </section>

  <section class="card hero">
    <div class="lbl" id="heroLbl"></div>
    <div class="big" id="avail"></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="stats">
      <div><span id="sInL">Recibido</span><b id="sIn"></b></div>
      <div>Propinas<b id="sTip"></b></div>
      <div>Gastado<b id="sOut"></b></div>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card save-card">
    <h2>Dinero juntado</h2>
    <div class="sv"><span>S/</span><input id="sv" type="number" inputmode="decimal" step="0.10" min="0" aria-label="Dinero juntado total"></div>
    <small id="svAt"></small>
    <small>Este dinero no se toca: no entra en tu presupuesto de la semana ni de cada día. Cambia el número cuando quieras.</small>
  </section>

  <section class="card">
    <div class="seg">
      <button id="tG" class="on g">Gasto</button>
      <button id="tP" class="p">Propina</button>
    </div>
    <div class="row">
      <div><label for="amt">Monto (S/)</label><input id="amt" type="number" inputmode="decimal" step="0.10" min="0" placeholder="0.00"></div>
      <div><label for="tm">Hora</label><input id="tm" type="time"></div>
    </div>
    <div style="margin-bottom:8px"><label for="dt">Fecha</label><input id="dt" type="date"></div>
    <div style="margin-bottom:10px"><label for="note">Detalle (opcional)</label><input id="note" type="text" placeholder="Almuerzo, taxi, recarga…"></div>
    <button class="add" id="add">Guardar gasto</button>
    <div class="quick">
      <button id="q1"></button>
      <button id="q2"></button>
    </div>
  </section>

  <section class="card">
    <h2>Gasto por día</h2>
    <div class="days" id="days"></div>
  </section>

  <section class="card">
    <h2 id="listT">Movimientos</h2>
    <div id="list"></div>
  </section>

  <section class="card">
    <h2>Ajustes</h2>
    <div class="cfg">
      <div><label for="cW">Dinero de cada domingo</label><input id="cW" type="number" step="1" min="0"></div>
      <div><label for="cF">Precio de un pasaje</label><input id="cF" type="number" step="0.10" min="0"></div>
    </div>
  </section>

  <section class="card hist">
    <h2>Semanas anteriores</h2>
    <div id="hist"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const KEY = 'mi-semana-v1';
let S = {weekly:300, fare:1.5, entries:[], saved:0, savedAt:null};
try { const r = JSON.parse(localStorage.getItem(KEY)); if (r) S = Object.assign(S, r); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const money = n => 'S/ ' + n.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const sunday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()-x.getDay()); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmt = d => d.toLocaleDateString('es-PE',{day:'numeric',month:'short'});
const hhmm = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
const DN = ['D','L','M','M','J','V','S'];

const thisSunday = sunday(new Date());
let view = new Date(thisSunday);
let mode = S.mode === 'dia' ? 'dia' : 'semana';
let day = parse(iso(new Date()));
const setWeek = s => { view = s; day = iso(s) === iso(thisSunday) ? parse(iso(new Date())) : new Date(s); };
let type = 'gasto';
let tmTouched = false;

function weekData(sun){
  const a = iso(sun), b = iso(addDays(sun,6));
  const es = S.entries.filter(e => e.d >= a && e.d <= b);
  const sum = t => es.filter(e => e.t === t).reduce((s,e) => s + e.a, 0);
  const tips = sum('propina'), out = sum('gasto');
  return {es, tips, out, total: S.weekly + tips, left: S.weekly + tips - out};
}

function dayData(d){
  const s0 = sunday(d), k = iso(d);
  const es = S.entries.filter(e => e.d >= iso(s0) && e.d <= iso(addDays(s0,6)));
  const bal = es.filter(e => e.d < k).reduce((x,e) => x + (e.t === 'propina' ? e.a : -e.a), S.weekly);
  const daysLeft = 7 - d.getDay();
  const allow = Math.max(0, bal / daysLeft);
  const td = es.filter(e => e.d === k);
  const sum = t => td.filter(e => e.t === t).reduce((x,e) => x + e.a, 0);
  const tips = sum('propina'), out = sum('gasto');
  return {es: td, allow, tips, out, total: allow + tips, left: allow + tips - out, daysLeft};
}

function render(){
  const dm = mode === 'dia';
  $('mDia').className = dm ? 'on' : '';
  $('mSem').className = dm ? '' : 'on';
  const isNow = iso(view) === iso(thisSunday);
  const w = weekData(view);
  let T = w, diff = 0;
  if (dm){
    T = dayData(day);
    $('dt').value = iso(day);
    diff = Math.round((parse(iso(new Date())) - parse(iso(day))) / 864e5);
    $('range').textContent = day.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'short'});
    $('wk').textContent = diff === 0 ? 'Hoy' : diff === 1 ? 'Ayer' : diff < 0 ? 'Día futuro' : 'Hace ' + diff + ' días';
    $('next').disabled = diff <= 0;
  } else {
    $('range').textContent = fmt(view) + ' – ' + fmt(addDays(view,6));
    $('wk').textContent = isNow ? 'Esta semana' : (view > thisSunday ? 'Semana futura' : 'Semana pasada');
    $('next').disabled = iso(view) >= iso(thisSunday);
  }

  const base = dm ? T.total : w.total;
  const pct = base > 0 ? Math.min(100, T.out / base * 100) : (T.out > 0 ? 100 : 0);
  const cls = T.left < 0 ? 'bad' : pct > 75 ? 'warn' : 'ok';
  $('heroLbl').textContent = dm ? (diff === 0 ? 'Te queda para hoy' : diff > 0 ? 'Ese día te sobró' : 'Disponible ese día')
                               : (isNow ? 'Te queda para esta semana' : 'Sobró de esa semana');
  $('avail').textContent = money(T.left);
  $('avail').className = 'big ' + cls;
  $('fill').style.width = pct + '%';
  $('fill').className = cls === 'ok' ? '' : cls;
  $('sInL').textContent = dm ? 'Para el día' : 'Recibido';
  $('sIn').textContent = money(dm ? T.allow : S.weekly);
  $('sTip').textContent = money(T.tips);
  $('sOut').textContent = money(T.out);

  let hint = '';
  if (dm){
    hint = 'En la semana te quedan ' + money(w.left) + '. ';
    hint += T.left < 0 ? 'Ese día te pasaste por ' + money(-T.left) + ' y los días siguientes tendrán menos.'
          : 'Lo que no gastes hoy se reparte entre los días que faltan.';
  } else if (isNow){
    const left = 7 - new Date().getDay();
    hint = w.left < 0
      ? 'Te pasaste por ' + money(-w.left) + '. Mira qué gasto puedes recortar.'
      : 'Puedes gastar hasta ' + money(w.left / left) + ' por día (' + left + (left === 1 ? ' día' : ' días') + ' hasta el sábado).';
  } else {
    hint = w.left < 0 ? 'Esa semana te pasaste por ' + money(-w.left) + '.' : 'Esa semana cerraste con ' + money(w.left) + ' de sobra.';
  }
  $('hint').textContent = hint;

  // gráfico por día
  const per = Array(7).fill(0);
  w.es.filter(e => e.t === 'gasto').forEach(e => per[parse(e.d).getDay()] += e.a);
  const max = Math.max(...per, 1);
  $('days').innerHTML = per.map((v,i) => {
    const t = dm ? iso(addDays(view,i)) === iso(day) : isNow && i === new Date().getDay();
    return `<div data-d="${iso(addDays(view,i))}" class="${t?'today':''}" title="${money(v)}"><i style="height:${v/max*80}%"></i>${DN[i]}</div>`;
  }).join('');

  // lista
  const by = {};
  (dm ? T.es : w.es).forEach(e => (by[e.d] = by[e.d] || []).push(e));
  const keys = Object.keys(by).sort().reverse();
  $('list').innerHTML = keys.length ?  keys.map(k => {
    const d = parse(k).toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'short'});
    return `<div class="day">${d}</div>` + by[k].slice().sort((a,b) => (b.h||'').localeCompare(a.h||'')).map(e =>
      `<div class="item"><small>${e.h || ''}</small><span>${esc(e.n) || (e.t==='gasto'?'Gasto':'Propina')}</span>
       <span class="m ${e.t==='gasto'?'g':'p'}" style="flex:none">${e.t==='gasto'?'−':'+'}${money(e.a)}</span>
       <button data-del="${e.id}" aria-label="Borrar">✕</button></div>`).join('');
  }).join('') : '<p class="empty">' + (dm ? 'Nada anotado este día.' : 'Aún no hay movimientos. Anota tu primer gasto o propina arriba.') + '</p>';

  // historial
  const hist = [];
  for (let i = 1; i <= 8; i++){
    const s = addDays(thisSunday, -7*i);
    const d = weekData(s);
    if (d.es.length) hist.push({s, d});
  }
  $('hist').innerHTML = hist.length ? hist.map(h =>
    `<button class="h" data-wk="${iso(h.s)}"><span>${fmt(h.s)} – ${fmt(addDays(h.s,6))}</span>
     <b style="color:var(--${h.d.left<0?'bad':'ok'})">${money(h.d.left)}</b></button>`).join('')
    : '<p class="empty">Cuando termine la semana, aquí verás cuánto te sobró.</p>';

  $('listT').textContent = dm ? 'Movimientos del día' : 'Movimientos de la semana';
  $('q1').textContent = '+ Pasaje ' + money(S.fare);
  $('q2').textContent = '+ Ida y vuelta ' + money(S.fare*2);
}

const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addEntry(t, a, n, d, h){
  if (!(a > 0)) { $('amt').focus(); return; }
  S.entries.push({id: Date.now() + Math.random(), t, a: Math.round(a*100)/100, n, d, h: h || hhmm(new Date())});
  save();
  day = parse(d); view = sunday(day);
  render();
}

function setType(t){
  type = t;
  $('tG').className = t === 'gasto' ? 'on g' : '';
  $('tP').className = t === 'propina' ? 'on p' : '';
  $('add').textContent = t === 'gasto' ? 'Guardar gasto' : 'Guardar propina';
}

$('tG').onclick = () => setType('gasto');
$('tP').onclick = () => setType('propina');
$('add').onclick = () => {
  addEntry(type, parseFloat($('amt').value), $('note').value.trim(), $('dt').value || iso(new Date()), $('tm').value);
  $('amt').value = ''; $('note').value = ''; tmTouched = false; tick();
};
$('q1').onclick = () => addEntry('gasto', S.fare, 'Pasaje', iso(mode === 'dia' ? day : new Date()));
$('q2').onclick = () => addEntry('gasto', S.fare*2, 'Pasaje ida y vuelta', iso(mode === 'dia' ? day : new Date()));
$('prev').onclick = () => { if (mode === 'dia'){ day = addDays(day,-1); view = sunday(day); } else setWeek(addDays(view,-7)); render(); };
$('next').onclick = () => { if (mode === 'dia'){ day = addDays(day,1); view = sunday(day); } else setWeek(addDays(view,7)); render(); };
$('mSem').onclick = () => { mode = 'semana'; S.mode = mode; save(); render(); };
$('mDia').onclick = () => { mode = 'dia'; S.mode = mode; save(); if (iso(sunday(day)) !== iso(view)) day = new Date(view); render(); };
$('days').onclick = e => { const b = e.target.closest('[data-d]'); if (b){ mode = 'dia'; S.mode = mode; save(); day = parse(b.dataset.d); view = sunday(day); render(); } };
$('list').onclick = e => {
  const id = e.target.dataset.del;
  if (id) { S.entries = S.entries.filter(x => String(x.id) !== id); save(); render(); }
};
$('hist').onclick = e => {
  const b = e.target.closest('[data-wk]');
  if (b) { setWeek(parse(b.dataset.wk)); render(); scrollTo({top:0,behavior:'smooth'}); }
};
$('cW').onchange = () => { S.weekly = Math.max(0, parseFloat($('cW').value) || 0); save(); render(); };
$('cF').onchange = () => { S.fare = Math.max(0, parseFloat($('cF').value) || 0); save(); render(); };

$('dt').value = iso(new Date());
$('tm').oninput = () => { tmTouched = true; };
function tick(){
  const n = new Date();
  $('now').textContent = n.toLocaleString('es-PE',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if (!tmTouched) $('tm').value = hhmm(n);
}
tick(); setInterval(tick, 1000);
function renderSaved(){
  $('sv').value = S.saved || 0;
  $('svAt').textContent = S.savedAt ? 'Última vez que lo cambiaste: ' + new Date(S.savedAt).toLocaleString('es-PE',{weekday:'long',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'Aún no lo has editado.';
}
$('sv').onchange = () => { S.saved = Math.max(0, parseFloat($('sv').value) || 0); S.savedAt = new Date().toISOString(); save(); renderSaved(); };
renderSaved();
$('cW').value = S.weekly;
$('cF').value = S.fare;
render();
</script>
</body>
</html>
